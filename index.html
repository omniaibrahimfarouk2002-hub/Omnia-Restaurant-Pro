<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطعم أمنية | المنصورة</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function App() {
  const [cart, setCart] = useState([]);
  const [filter, setFilter] = useState('الكل');
  const [name, setName] = useState('');
  const [address, setAddress] = useState('');

  const menu = [
    { id: 1, name: "برجر دبل", cat: "برجر", price: 120, emoji: "🍔", desc: "لحم طازة + جبنة + صوص خاص" },
    { id: 2, name: "برجر كرسبي", cat: "برجر", price: 140, emoji: "🍔", desc: "فراخ مقرمشة + صوص رانش" },
    { id: 3, name: "بيتزا مارجريتا", cat: "بيتزا", price: 150, emoji: "🍕", desc: "جبنة موتزاريلا + صلصة طماطم" },
    { id: 4, name: "بيتزا خضار", cat: "بيتزا", price: 130, emoji: "🍕", desc: "خضار طازة + جبنة" },
    { id: 5, name: "عصير مانجو", cat: "مشروبات", price: 50, emoji: "🥭", desc: "مانجو طبيعي فريش" },
    { id: 6, name: "عصير برتقال", cat: "مشروبات", price: 40, emoji: "🍊", desc: "برتقال فريش" },
  ];

  const filtered = filter === 'الكل' ? menu : menu.filter(m => m.cat === filter);
  const total = cart.reduce((sum, item) => sum + item.price, 0);

  const addToCart = (item) => setCart([...cart, item]);

  const orderWhatsApp = () => {
    let msg = `أهلاً أمنية، عايز اطلب من مطعم أمنية - المنصورة%0A%0A`;
    msg += `الاسم: ${name}%0Aالعنوان: ${address}%0A%0A`;
    cart.forEach((item, i) => { msg += `${i+1}. ${item.name} - ${item.price} جنيه%0A`; });
    msg += `%0Aالاجمالي: ${total} جنيه`;
    window.open(`https://wa.me/201068348772?text=${msg}`, '_blank');
  };

  return (
    <div className="min-h-screen bg-orange-50 pb-10">
      {/* الهيدر */}
      <div className="bg-orange-500 text-white p-6 text-center rounded-b-3xl">
        <h1 className="text-3xl font-bold">مطعم أمنية 🍔</h1>
        <p>المنصورة، الدقهلية | توصيل سريع</p>
        <p>📞 01068348772</p>
      </div>

      {/* الفلتر */}
      <div className="flex gap-2 justify-center mt-4 flex-wrap px-4">
        {['الكل','برجر','بيتزا','مشروبات'].map(c => (
          <button key={c} onClick={() => setFilter(c)} className={filter===c ? "bg-orange-500 text-white px-4 py-2 rounded-full font-bold" : "bg-white px-4 py-2 rounded-full shadow"}>
            {c}
          </button>
        ))}
      </div>

      {/* المنيو */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 max-w-3xl mx-auto">
        {filtered.map(item => (
          <div key={item.id} className="bg-white p-4 rounded-2xl shadow flex justify-between items-center">
            <div>
              <h2 className="font-bold text-lg">{item.emoji} {item.name}</h2>
              <p className="text-gray-500 text-sm">{item.desc}</p>
              <p className="font-bold text-orange-600 mt-1">{item.price} جنيه</p>
            </div>
            <button onClick={() => addToCart(item)} className="bg-orange-500 text-white px-4 py-2 rounded-full font-bold">أضف +</button>
          </div>
        ))}
      </div>

      {/* السلة */}
      <div className="bg-white p-4 rounded-2xl shadow max-w-3xl mx-auto mx-4 md:mx-auto">
        <h2 className="font-bold text-xl text-center">🛒 سلتك: {cart.length} منتج - الإجمالي: {total} جنيه</h2>
        {cart.length === 0 && <p className="text-center text-gray-400 mt-2">السلة فاضية، ضيفي حاجة</p>}
        {cart.map((item, i) => (
          <p key={i} className="text-center text-sm">{item.name} - {item.price} جنيه</p>
        ))}
        <input value={name} onChange={e => setName(e.target.value)} placeholder="اسمك" className="w-full border p-3 rounded-xl mt-3" />
        <input value={address} onChange={e => setAddress(e.target.value)} placeholder="عنوانك في المنصورة" className="w-full border p-3 rounded-xl mt-2" />
        <button onClick={orderWhatsApp} className="w-full bg-green-500 text-white py-3 rounded-xl font-bold mt-3">اطلب واتساب 📲</button>
        <button onClick={() => setCart([])} className="w-full bg-gray-200 py-2 rounded-xl mt-2 text-sm">امسح السلة</button>
      </div>

      {/* الفوتر */}
      <p className="text-center text-xs text-gray-400 mt-8 px-4">
        This is a Demo Project by Omnia Ibrahim - Mansoura, Dakahlia<br/>
        For Portfolio | WhatsApp: 01068348772
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
