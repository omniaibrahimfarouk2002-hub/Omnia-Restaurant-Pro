<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطعم أمنية | المنصورة</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
function App() {
  const [cart, setCart] = useState({});
  const [filter, setFilter] = useState('الكل');
  const [search, setSearch] = useState('');
  const [fav, setFav] = useState([]);
  const [name, setName] = useState('');
  const [address, setAddress] = useState('');
  const [promo, setPromo] = useState('');
  const [dark, setDark] = useState(false);

  const menu = [
    { id:1, name:"برجر دبل", cat:"برجر", price:120, img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400", desc:"لحم طازة + جبنة" },
    { id:2, name:"برجر كرسبي", cat:"برجر", price:140, img:"https://images.unsplash.com/photo-1550547660-d9450f859349?w=400", desc:"فراخ مقرمشة + رانش" },
    { id:3, name:"بيتزا مارجريتا", cat:"بيتزا", price:150, img:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400", desc:"موتزاريلا + طماطم" },
    { id:4, name:"بيتزا خضار", cat:"بيتزا", price:130, img:"https://images.unsplash.com/photo-1511689660979-10d2b1aada49?w=400", desc:"خضار طازة" },
    { id:5, name:"عصير مانجو", cat:"مشروبات", price:50, img:"https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=400", desc:"مانجو فريش" },
    { id:6, name:"عصير برتقال", cat:"مشروبات", price:40, img:"https://images.unsplash.com/photo-1600271772470-bd22c3a5c7a0?w=400", desc:"برتقال فريش" },
  ];

  const filtered = menu.filter(m => (filter==='الكل' || m.cat===filter) && m.name.includes(search));
  const totalItems = Object.values(cart).reduce((a,b)=>a+b,0);
  let subtotal = Object.entries(cart).reduce((sum,[id,qty]) => sum + menu.find(m=>m.id==id).price*qty, 0);
  let discount = promo==='OMNIA10' ? subtotal*0.1 : 0;
  let delivery = subtotal>0 ? 30 : 0;
  let total = subtotal - discount + delivery;

  const changeQty = (id, delta) => {
    setCart(prev => {
      let n = {...prev};
      n[id] = (n[id]||0)+delta;
      if(n[id]<=0) delete n[id];
      return n;
    });
  };
  const toggleFav = (id) => setFav(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);

  const order = () => {
    let msg = `أهلاً أمنية - مطعم أمنية المنصورة%0Aالاسم: ${name}%0Aالعنوان: ${address}%0A%0A`;
    Object.entries(cart).forEach(([id,qty])=>{ let it=menu.find(m=>m.id==id); msg+=`${it.name} x${qty} = ${it.price*qty} جنيه%0A`; });
    msg+=`%0Aخصم: ${discount} - توصيل: ${delivery}%0Aالاجمالي: ${total} جنيه`;
    window.open(`https://wa.me/201068348772?text=${msg}`,'_blank');
  };

  return (
    <div className={dark ? "min-h-screen bg-gray-900 text-white pb-10" : "min-h-screen bg-orange-50 pb-10"}>
      <div className="bg-orange-500 text-white p-6 text-center rounded-b-3xl">
        <h1 className="text-3xl font-bold">مطعم أمنية 🍔</h1>
        <p>المنصورة، الدقهلية | 01068348772</p>
        <button onClick={()=>setDark(!dark)} className="bg-black/20 px-4 py-1 rounded-full mt-2 text-sm">{dark ? "☀️ فاتح" : "🌙 غامق"}</button>
      </div>

      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 دور على أكلة..." className="block w-[90%] max-w-3xl mx-auto mt-4 p-3 rounded-xl border text-black" />

      <div className="flex gap-2 justify-center mt-3 flex-wrap px-4">
        {['الكل','برجر','بيتزا','مشروبات'].map(c=>(
          <button key={c} onClick={()=>setFilter(c)} className={filter===c ? "bg-orange-500 text-white px-4 py-2 rounded-full font-bold" : "bg-white text-black px-4 py-2 rounded-full shadow"}>{c}</button>
        ))}
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 max-w-3xl mx-auto">
        {filtered.map(item=>(
          <div key={item.id} className="bg-white text-black rounded-2xl shadow overflow-hidden">
            <img src={item.img} className="w-full h-40 object-cover" />
            <div className="p-4 flex justify-between items-start">
              <div>
                <h2 className="font-bold text-lg">{item.name} <button onClick={()=>toggleFav(item.id)}>{fav.includes(item.id) ? "❤️" : "🤍"}</button></h2>
                <p className="text-gray-500 text-sm">{item.desc}</p>
                <p className="font-bold text-orange-600">{item.price} جنيه</p>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={()=>changeQty(item.id,1)} className="bg-orange-500 text-white w-8 h-8 rounded-full font-bold">+</button>
                <span className="font-bold">{cart[item.id]||0}</span>
                <button onClick={()=>changeQty(item.id,-1)} className="bg-gray-200 w-8 h-8 rounded-full font-bold">-</button>
              </div>
            </div>
          </div>
        ))}
      </div>

      <div className="bg-white text-black p-4 rounded-2xl shadow max-w-3xl mx-auto mx-4 md:mx-auto">
        <h2 className="font-bold text-xl text-center">🛒 سلتك: {totalItems} منتج</h2>
        {Object.entries(cart).map(([id,qty])=>{ let it=menu.find(m=>m.id==id); return <p key={id} className="text-center text-sm">{it.name} x{qty} = {it.price*qty} جنيه <button onClick={()=>changeQty(id,-qty)} className="text-red-500">❌</button></p> })}
        <p className="text-center mt-2">المجموع: {subtotal} | خصم: {discount} | توصيل: {delivery} | <b>الإجمالي: {total} جنيه</b></p>
        <input value={promo} onChange={e=>setPromo(e.target.value)} placeholder="كود خصم - جربي OMNIA10" className="w-full border p-3 rounded-xl mt-2" />
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="اسمك" className="w-full border p-3 rounded-xl mt-2" />
        <input value={address} onChange={e=>setAddress(e.target.value)} placeholder="عنوانك في المنصورة" className="w-full border p-3 rounded-xl mt-2" />
        <button onClick={order} className="w-full bg-green-500 text-white py-3 rounded-xl font-bold mt-3">اطلب واتساب 📲 - {total} جنيه</button>
      </div>
      <p className="text-center text-xs text-gray-400 mt-8">This is a Demo Project by Omnia Ibrahim - Mansoura, Dakahlia<br/>For Portfolio | WhatsApp: 01068348772</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
